[project]
name = "pd3-etl"
version = "0.1.0"
description = "PD3 data build: raw pdv2 captures + curated YAML -> static JSON bundles"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "pyyaml>=6"]

[project.scripts]
pd3-etl = "pd3_etl.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pd3_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
