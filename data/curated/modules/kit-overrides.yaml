# Display metadata for SBT panel kits captured from pdv2 (keyed by the raw pdv2 kit name).
# Every captured kit must be listed with a stable `id` - the ledger that the web app, share links and saved panels key on
# (`kit-<pdv2 kit_id>`, disambiguated by hand when pdv2 reuses a kit_id). The other fields are display metadata.
# category values: lineage | functional | tissue | disease | scaffolding | assay
