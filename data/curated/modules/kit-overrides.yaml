# Display metadata for SBT panel kits captured from pdv2 (keyed by the raw pdv2 kit name).
# Anything not listed gets an auto-generated name and category "uncategorised".
# category values: lineage | functional | tissue | disease | scaffolding | assay
version: 2026-08-24.1
kits:
  # ---------------- IMC ----------------
  Hu_Basic_Immune_IMC_Panel_4_Antibodies:
    name: Basic immune
    category: lineage
    featured: true
    blurb: The four markers that separate B cells, T cells, macrophages and all leukocytes in tissue.
  Hu_Lymphoid_IMC_Panel_4_Antibodies:
    name: Lymphoid
    category: lineage
    featured: true
    blurb: CD4 and CD8 T-cell subsets, B cells and NK cells.
  Hu_Myeloid_IMC_Panel_6_Antibodies:
