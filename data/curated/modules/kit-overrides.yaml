    category: lineage
    featured: true
    blurb: Macrophage, monocyte, dendritic-cell and granulocyte markers, including M2-like CD163.
  Hu_T_Cell_Exhaustion_IMC_Panel_5_Andibodies:
    name: T-cell exhaustion
    category: functional
    featured: true
    blurb: Checkpoint and exhaustion markers (TIM-3, LAG-3, OX40, CTLA-4, IDO) for immuno-oncology.
  Hu_Cell_Functional_State_IMC_Panel_5_Antibodies:
    name: Functional state
    category: functional
    featured: true
    blurb: Proliferation, Tregs, PD-1 / PD-L1 and cytotoxic activity (Ki-67, FoxP3, PD-1, PD-L1, Granzyme B).
