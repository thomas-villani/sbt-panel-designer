      - {target: Synaptophysin, abundance: high, role: optional}
      - {target: GFAP, abundance: very_high}
      - {target: Iba1, abundance: high}
      - {target: Olig2, abundance: medium, role: recommended}
      - {target: MBP, abundance: very_high, role: recommended}
      - {target: S100β, abundance: high, role: optional}

