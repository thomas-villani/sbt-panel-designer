    sample_types: [ffpe, frozen]
    category: structural
    featured: true
    blurb: Neurons (NeuN, MAP2, neurofilament, synaptophysin), astrocytes (GFAP), microglia (Iba1), oligodendrocytes and myelin (Olig2, MBP).
