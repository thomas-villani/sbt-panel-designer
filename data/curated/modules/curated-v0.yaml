    species: [human]
    sample_types: [ffpe, frozen]
    category: structural
    featured: true
    blurb: Collagen and fibronectin for the matrix, vimentin, αSMA and FAP for the fibroblasts that lay it down.
    markers:
      - {target: Collagen Type I, abundance: very_high}
      - {target: Fibronectin, abundance: high, role: recommended}
      - {target: Vimentin, abundance: very_high}
      - {target: α-Smooth Muscle Actin, abundance: very_high}
      - {target: FAP, abundance: medium, role: optional}

  - id: imc-nuclei-proliferation
    name: Nuclei and proliferation (IMC)
    aliases: [nuclear, nuclei, proliferation, cell cycle, mitosis, histone, Ki-67, segmentation, structure, structural]
    application: imaging
    species: [human]
    sample_types: [ffpe, frozen]
    category: structural
    featured: true
    blurb: Histone H3 for every nucleus (a segmentation aid alongside the Ir intercalator), Ki-67 for cycling cells, pHistone H3 for mitosis.
    markers:
      - {target: Histone H3, abundance: very_high}
      - {target: Ki-67, abundance: high}
      - {target: "pHistone H3 [Ser28]", abundance: high, role: optional}

  - id: imc-brain-structure
