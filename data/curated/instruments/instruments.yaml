# Instrument definitions. Physics lives in data, not code (SPEC §11).
# po_matrix: pdv2 instrument id whose captured spillover file is used (data/pdv2-api/api_spillover_{id}.txt).
# sensitivity_curve: pdv2 panel_type whose massbias file is used (0 = suspension, 1 = IMC).
# reserved: channel roles that consume channels when the corresponding scaffolding option is on.
version: 2026-08-26.1
sources:
  po_matrices: "pdv2.standardbio.com /spillover/get_customer/{instrument}, captured 2026-08-24"
  sensitivity_curves: "pdv2.standardbio.com /massbias/get/{panel_type}, captured 2026-08-24 (coarse, 1 dp)"
  notes: "Helios(1) == CyTOF XT(4); Hyperion 5/6/7 share one matrix; CyTOF(2)/CyTOF2(3) are legacy larger-overlap sets."
  conjugation: "SBT 'High purity metal tags available for custom conjugation' tables (CyTOF and IMC), from an SBT scientist 2026-08-26"

instruments:
  - id: cytof_xt
    name: CyTOF XT
    modality: suspension
    pdv2_id: 4
    po_matrix: 4
    sensitivity_curve: 0
    current: true
    default_for_modality: true
  - id: helios
    name: Helios
    modality: suspension
    pdv2_id: 1
    po_matrix: 1
    sensitivity_curve: 0
    current: true
  - id: cytof2
    name: CyTOF 2
    modality: suspension
    pdv2_id: 3
    po_matrix: 3
    sensitivity_curve: 0
    current: false
  - id: cytof1
    name: CyTOF
    modality: suspension
    pdv2_id: 2
    po_matrix: 2
    sensitivity_curve: 0
    current: false
  - id: hyperion_xti
    name: Hyperion XTi
    modality: imaging
    pdv2_id: 7
    po_matrix: 7
    sensitivity_curve: 1
    current: true
    default_for_modality: true
  - id: hyperion_plus
    name: Hyperion+
    modality: imaging
    pdv2_id: 6
    po_matrix: 6
    sensitivity_curve: 1
    current: true
  - id: hyperion
    name: Hyperion
    modality: imaging
    pdv2_id: 5
    po_matrix: 5
    sensitivity_curve: 1
    current: false

# Channel roles per modality. `default: true` roles are reserved unless the user turns the option off.
reserved:
  suspension:
    - role: dna_intercalator
      label: DNA intercalator (Ir)
      masses: [191, 193]
      default: true
      hard: true
    - role: viability_cisplatin
      label: Viability (cisplatin, natural Pt)
      masses: [194, 195, 198]
      default: true
      hard: false
      note: "Natural-abundance cisplatin lights 194, 195 and 198Pt; keep all three clear. Monoisotopic 195Pt or 198Pt cisplatin frees the other two."
    - role: viability_pt195
      label: Viability (monoisotopic 195Pt cisplatin)
      masses: [195]
      default: false
      hard: false
      note: "Cell-ID Cisplatin-195Pt: one channel; 194 and 198Pt stay free for antibodies."
    - role: viability_pt198
      label: Viability (monoisotopic 198Pt cisplatin)
      masses: [198]
      default: false
      hard: false
      note: "Cell-ID Cisplatin-198Pt: one channel; 194 and 195Pt stay free for antibodies."
    - role: viability_rhodium
      label: Viability (Rh103 intercalator)
      masses: [103]
      default: false
      hard: false
      note: "Cell-ID Intercalator-Rh: a DNA intercalator that only enters dead cells; uses 103Rh, no Pt channel."
    - role: barcoding_pd
      label: Cell barcoding (Cell-ID 20-Plex Pd)
      masses: [102, 104, 105, 106, 108, 110]
      default: false
      hard: true
      note: "Six Pd channels; 106Cd and 110Cd antibody channels are lost while barcoding."
    - role: eq_beads
      label: EQ normalisation beads
      masses: [140, 151, 153, 165, 175]
      default: false
      hard: false
      note: "Flag, do not forbid: antibodies can share bead channels if beads are gated out."
  imaging:
    - role: dna_intercalator
      label: DNA intercalator (Ir)
      masses: [191, 193]
      default: true
      hard: true
    - role: segmentation_kit
      label: Cell segmentation kit (Pt)
      masses: [195, 196, 198]
      default: true
      hard: true
    - role: ruthenium_counterstain
      label: Ruthenium counterstain
      masses: [96, 98, 99, 100, 101, 102, 104]
      default: false
      hard: true

# Metals SBT offers for antibody conjugation, per modality (source: sources.conjugation). This, not the pdv2 sensitivity
# curve, decides which channels can carry an antibody: a channel the instrument detects but no tag is sold for (157Gd,
# 194Pt/197Au on IMC) is not part of the antibody budget. Custom conjugations may use any metal listed here.
conjugation:
  suspension:
    note: "51 metals. The CyTOF table's 'Nd 149' is a typo for 148Nd (confirmed by Tom 2026-08-26). 113 is sold as 113Cd. 157Gd is not sold at all (Gd offered: 155, 156, 158, 160)."
    masses: [89, 106, 110, 111, 112, 113, 114, 115, 116, 139, 141, 142, 143, 144, 145, 146, 147, 148, 149, 150, 151, 152,
             153, 154, 155, 156, 158, 159, 160, 161, 162, 163, 164, 165, 166, 167, 168, 169, 170, 171, 172, 173, 174, 175,
             176, 194, 195, 196, 197, 198, 209]
  imaging:
    note: "41 metals; 3 of them Pt. SBT: 'Pt for IMC has limited use and really should only be used for ICSK (the cell segmentation kit) due to performance'. No Cd, La, 194Pt or 197Au. With the two Ir DNA channels that is 43 channels, 38 for antibodies."
    masses: [89, 115, 141, 142, 143, 144, 145, 146, 147, 148, 149, 150, 151, 152, 153, 154, 155, 156, 158, 159, 160, 161,
             162, 163, 164, 165, 166, 167, 168, 169, 170, 171, 172, 173, 174, 175, 176, 195, 196, 198, 209]

# Metals SBT does not list for conjugation on a modality but that some labs use anyway. Off by default; the UI asks the
# user to opt in and labels every marker that lands on one. Masses must be detectable channels of the instruments.
advanced:
  suspension: []
  imaging:
    - id: cadmium
      label: Cadmium (106-116Cd)
      masses: [106, 110, 111, 112, 113, 114, 116]
      # The IMC sensitivity curve has no Cd entry; assume the low end of the mass range (115In = 0.3) until SBT supplies data.
      rel_sensitivity: 0.3
      # Source: SBT FAS feedback, 2026-08-27.
      note: "Not on the IMC conjugation list: some labs get Cd conjugates to work on tissue, but it is tissue-dependent. Validate on your own sections before relying on it."

# Human-readable channel range classes so the UI can say "low-sensitivity channel" without listing masses.
range_classes:
  - id: bright_only
    label: Low-sensitivity channel (bright markers only)
    masses_below: 142
    note: "89Y, Cd 106-116, 115In, 141Pr: classic bright-marker channels. Cd exists on suspension instruments only."
  - id: mid
    label: Mid-sensitivity channel
    masses: [142, 152]
  - id: sweet_spot
    label: High-sensitivity channel (153-176)
    masses: [153, 176]
  - id: heavy
    label: Reduced-sensitivity heavy channel
    masses_above: 176
    note: "Pt 194-198, Bi 209: ~0.7 relative sensitivity."
