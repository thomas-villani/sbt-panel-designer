# Curated target aliases. Each entry: canonical display name -> list of other spellings.
# Merging rules applied automatically by the ETL BEFORE this file:
#   1. normalised key (lowercase, Greek folded, non-alphanumerics removed) equality
#   2. store <-> pdv2 names joined by part number (ground truth)
#   3. "CDnnn/Name" strings: the CD number part is the join key
# This file handles what those rules miss. Names are matched by normalised key, so case/punctuation do not matter.
