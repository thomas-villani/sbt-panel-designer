name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run --frozen pytest -q
        working-directory: etl
      # data/build is committed and served by the web app: regenerate it and fail if the checked-in bundles are stale.
      # `version` carries the build date, so it always differs; -I drops hunks whose only changed lines are that field.
      - name: Rebuild bundles
        working-directory: etl
        run: |
          uv run --frozen pd3-etl instruments
          uv run --frozen pd3-etl catalog
          uv run --frozen pd3-etl modules
      - name: data/build is up to date
        run: git diff --exit-code -I '"version"' -- data/build

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci && npm run typecheck && npm test && npm run validate:check
        working-directory: engine

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
        working-directory: engine
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
